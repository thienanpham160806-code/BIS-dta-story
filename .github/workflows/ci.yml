name: CI

on:
  push:
    branches: [main, all-countries]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: pytest -q

      - name: Notebook runs end to end
        run: jupyter nbconvert --to notebook --execute --output-dir /tmp --output executed notebooks/01_analysis.ipynb

      - name: Site data matches data/raw
        run: python product/check_site_data.py
